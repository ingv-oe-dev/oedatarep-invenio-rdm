name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check out oedatarep-ts-loader
        run: |
          git clone --depth 1 \
            --branch "${{ vars.OEDATAREP_RELEASE }}" \
            https://github.com/ingv-oe-dev/oedatarep-ts-loader.git \
            ../oedatarep-ts-loader

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Verify uv.lock
        run: uv lock --check

      - name: Check Python syntax
        run: uv run python -m compileall -q site

      - name: Validate YAML syntax
        shell: bash
        run: |
          uv run --with PyYAML python - <<'PY'
          from pathlib import Path

          import yaml


          for path in Path(".").rglob("*"):
              if not path.is_file():
                  continue
              if path.suffix not in {".yml", ".yaml"}:
                  continue
              if ".git" in path.parts:
                  continue

              with path.open("r", encoding="utf-8") as stream:
                  list(yaml.safe_load_all(stream))

              print(f"Valid YAML: {path}")
          PY

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: |
            OEDATAREP_RELEASE=${{ vars.OEDATAREP_RELEASE }}
          tags: oedatarep-invenio-rdm:ci
