services:
  app:
    build:
      context: ./
      args:
        - ENVIRONMENT=DEV
        - OEDATAREP_RELEASE=v12.x-oe
    image: oedatarep-invenio-rdm
    restart: "unless-stopped"
    environment:
      - "INVENIO_ACCOUNTS_SESSION_REDIS_URL=redis://cache:6379/1"
      - "INVENIO_BROKER_URL=amqp://guest:guest@mq:5672/"
      - "INVENIO_CACHE_REDIS_URL=redis://cache:6379/0"
      - "INVENIO_CACHE_TYPE=RedisCache"
      - "INVENIO_CELERY_BROKER_URL=amqp://guest:guest@mq:5672/"
      - "INVENIO_CELERY_RESULT_BACKEND=redis://cache:6379/2"
      - "INVENIO_COMMUNITIES_IDENTITIES_CACHE_REDIS_URL=redis://cache:6379/4"
      - "INVENIO_SEARCH_HOSTS=['search:9200']"
      - "INVENIO_SECRET_KEY=CHANGE_ME"
      - "INVENIO_SQLALCHEMY_DATABASE_URI=postgresql+psycopg2://oedatarep-invenio-rdm:oedatarep-invenio-rdm@db/oedatarep-invenio-rdm"
      - "INVENIO_PROXYFIX_CONFIG={'x_for': 1, 'x_proto': 1}"
      - "INVENIO_RATELIMIT_STORAGE_URL=redis://cache:6379/3"
      # If you are deploying your site on a non-local host
      # make sure to change those values accordingly.
      - "INVENIO_SITE_UI_URL=https://127.0.0.1"
      - "INVENIO_SITE_API_URL=https://127.0.0.1/api"
  frontend:
    build: ./docker/nginx/
    image: oedatarep-invenio-rdm-frontend
    restart: "unless-stopped"
    ports:
      - "${DOCKER_WEB_IP_BIND:-0.0.0.0}:80:80"
      - "${DOCKER_WEB_IP_BIND:-0.0.0.0}:443:443"
  cache:
    image: redis:7
    restart: "unless-stopped"
    read_only: true
    ports:
      - "${DOCKER_SERVICES_IP_BIND:-127.0.0.1}:6379:6379"
  db:
    image: postgres:17.10
    restart: "unless-stopped"
    environment:
      - "POSTGRES_USER=oedatarep-invenio-rdm"
      - "POSTGRES_PASSWORD=oedatarep-invenio-rdm"
      - "POSTGRES_DB=oedatarep-invenio-rdm"
    ports:
      - "${DOCKER_SERVICES_IP_BIND:-127.0.0.1}:5432:5432"
  pgadmin:
    image: dpage/pgadmin4:6
    restart: "unless-stopped"
    ports:
      - "${DOCKER_SERVICES_IP_BIND:-127.0.0.1}:5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: "info@oedatarep-invenio-rdm.com"
      PGADMIN_DEFAULT_PASSWORD: "oedatarep-invenio-rdm"
    volumes:
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json
  # note: RabbitMQ uses the hostname to build the Mnesia data directory path (cf. https://www.rabbitmq.com/docs/configure)
  #       using a randomly generated hostname "forgets" about old queued messages (e.g. celery tasks) with new builds,
  #       and hard-coding the Mnesia path with random hostnames leads to connection issues on startup for old names
  mq:
    image: rabbitmq:3-management
    restart: "unless-stopped"
    hostname: mq
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "${DOCKER_SERVICES_IP_BIND:-127.0.0.1}:15672:15672"
      - "${DOCKER_SERVICES_IP_BIND:-127.0.0.1}:5672:5672"
  flower:
    image: mher/flower:2.0.1
    restart: "unless-stopped"
    ports:
      - "${DOCKER_SERVICES_IP_BIND:-127.0.0.1}:5555:5555"
    command: celery --broker=amqp://guest:guest@mq:5672/ flower
    depends_on:
      mq:
        condition: service_started
  search:
    image: opensearchproject/opensearch:2.19.5
    restart: "unless-stopped"
    environment:
      # Settings only for development. DO NOT use in production!
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "OPENSEARCH_INITIAL_ADMIN_PASSWORD=CHANGE_me_0!"
      - "DISABLE_INSTALL_DEMO_CONFIG=true"
      - "DISABLE_SECURITY_PLUGIN=true"
      - "discovery.type=single-node"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: 2g
    ports:
      - "${DOCKER_SERVICES_IP_BIND:-127.0.0.1}:9200:9200"
      - "${DOCKER_SERVICES_IP_BIND:-127.0.0.1}:9600:9600"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.19.5
    ports:
      - "${DOCKER_SERVICES_IP_BIND:-127.0.0.1}:5601:5601"
    expose:
      - "5601"
    environment:
      # settings only for development. DO NOT use in production!
      - 'OPENSEARCH_HOSTS=["http://search:9200"]'
      - "DISABLE_SECURITY_DASHBOARDS_PLUGIN=true"
